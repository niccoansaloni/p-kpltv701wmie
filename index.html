/* chiudi un pannello trascinandolo verso il basso (da maniglia, intestazione o dall'inizio del contenuto) */
function swipeDismiss(dlg){
  let y0=null,x0=0,dy=0,head=false,on=false,t0=0;
  const phone=()=>matchMedia('(max-width:860px)').matches;
  const atTop=el=>{for(;el&&el!==dlg;el=el.parentElement){if(el.scrollHeight>el.clientHeight+1&&/auto|scroll/.test(getComputedStyle(el).overflowY)&&el.scrollTop>0)return false;}return true;};
  dlg.addEventListener('touchstart',e=>{
    if(!phone()||e.touches.length!==1){y0=null;return;}
    const t=e.touches[0];y0=t.clientY;x0=t.clientX;dy=0;on=false;t0=Date.now();head=!!e.target.closest('.sh,.fh');
  },{passive:true});
  dlg.addEventListener('touchmove',e=>{
    if(y0===null)return;const t=e.touches[0],mx=t.clientX-x0,my=t.clientY-y0;
    if(!on){
      if(my>10&&my>Math.abs(mx)*1.2&&(head||(atTop(e.target)&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)))){on=true;dlg.style.transition='none';}
      else{if(Math.abs(mx)>12||my<-8)y0=null;return;}
    }
    dy=Math.max(0,my);dlg.style.transform='translateY('+dy+'px)';if(e.cancelable)e.preventDefault();
  },{passive:false});
  const fin=()=>{
    if(y0===null||!on){y0=null;return;}
    const vel=dy/Math.max(1,Date.now()-t0);dlg.style.transition='transform .2s ease';
    if(dy>120||(vel>.7&&dy>40)){dlg.style.transform='translateY(100%)';setTimeout(()=>{dlg.close();dlg.style.transition='';dlg.style.transform='';},190);}
    else{dlg.style.transform='';setTimeout(()=>{dlg.style.transition='';},220);}
    y0=null;on=false;
  };
  dlg.addEventListener('touchend',fin);dlg.addEventListener('touchcancel',fin);
}
swipeDismiss(sheet);swipeDismiss(small);

/* trascinamento: tieni premuto un allenamento e portalo su un altro giorno */
(function(){
  const HOLD=380,SLOP=10;let g=null,suppress=0,raf=0;
  const dropAt=(x,y)=>{const e=document.elementFromPoint(x,y),c=e&&e.closest('[data-day],.day[data-date]');return c?{el:c,date:c.dataset.day||c.dataset.date}:null;};
  const place=()=>{if(g&&g.ghost){g.ghost.style.left=g.x+'px';g.ghost.style.top=g.y+'px';}};
  const hover=()=>{const o=dropAt(g.x,g.y);if(g.over&&(!o||o.el!==g.over.el))g.over.el.classList.remove('drop-on');if(o)o.el.classList.add('drop-on');g.over=o;};
  const loop=()=>{cancelAnimationFrame(raf);const step=()=>{if(!g||!g.active)return;const hh=innerHeight;let dy=0;
    if(g.y<90)dy=-Math.ceil((90-g.y)/5);else if(g.y>hh-120)dy=Math.ceil((g.y-(hh-120))/5);
    if(dy){scrollBy(0,dy);hover();}raf=requestAnimationFrame(step);};raf=requestAnimationFrame(step);};
  function cancel(){if(!g)return;clearTimeout(g.t);cancelAnimationFrame(raf);g.el.classList.remove('lp-pre','drag-src');if(g.ghost)g.ghost.remove();if(g.over)g.over.el.classList.remove('drop-on');document.body.classList.remove('dragging');g=null;}
  function activate(){
    if(!g||g.active)return;const s=byId(g.id);if(!s){cancel();return;}
    g.active=true;clearTimeout(g.t);
    const k=document.createElement('div');k.className='dgh '+TCLS(s);k.innerHTML=esc(esc2(s.title))+'<span>'+fmtDay(s.date)+'</span>';document.body.appendChild(k);g.ghost=k;
    g.el.classList.remove('lp-pre');g.el.classList.add('drag-src');document.body.classList.add('dragging');
    if(navigator.vibrate)try{navigator.vibrate(18);}catch(e){}
    place();hover();loop();
  }
  function begin(el,x,y,touch){
    cancel();const id=el.dataset.open;if(!id||!byId(id))return;
    g={id,el,x0:x,y0:y,x,y,touch,active:false,over:null,ghost:null,t:null};
    if(touch){g.el.classList.add('lp-pre');g.t=setTimeout(activate,HOLD);}
  }
  function move(x,y,ev){
    if(!g)return;g.x=x;g.y=y;
    if(!g.active){if(Math.hypot(x-g.x0,y-g.y0)>(g.touch?SLOP:6)){if(g.touch)cancel();else activate();}return;}
    if(ev&&ev.cancelable)ev.preventDefault();place();hover();
  }
  function end(){
    if(!g)return;const q=g,active=g.active,over=g.over;cancel();
    if(active){suppress=Date.now();const s=byId(q.id);if(over&&s&&over.date!==s.date)moveSession(q.id,over.date);}
  }
  const pick=e=>e.target.closest&&e.target.closest('.tile[data-open],.chip[data-open]');
  document.addEventListener('touchstart',e=>{if(e.touches.length!==1){cancel();return;}const el=pick(e);if(el){const t=e.touches[0];begin(el,t.clientX,t.clientY,true);}},{passive:true});
  document.addEventListener('touchmove',e=>{if(g){const t=e.touches[0];move(t.clientX,t.clientY,e);}},{passive:false});
  document.addEventListener('touchend',end);
  document.addEventListener('touchcancel',cancel);
  document.addEventListener('mousedown',e=>{if(e.button!==0)return;const el=pick(e);if(el)begin(el,e.clientX,e.clientY,false);});
  document.addEventListener('mousemove',e=>{if(g&&!g.touch)move(e.clientX,e.clientY,e);});
  document.addEventListener('mouseup',()=>{if(g&&!g.touch)end();});
  document.addEventListener('contextmenu',e=>{if(pick(e)&&(g||'ontouchstart' in window))e.preventDefault();});
  document.addEventListener('click',e=>{if(Date.now()-suppress<450&&e.target.closest('.tile,.chip,.mc,.day')){e.stopPropagation();e.preventDefault();}},true);
})();
