<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WeChain">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151B" media="(prefers-color-scheme: dark)">
<title>WeChain</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="wechain-icon.svg">
<link rel="apple-touch-icon" sizes="192x192" href="wechain-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7; --card:#FFFFFF; --ink:#1A2230; --muted:#626D7C; --line:#E2E5EA; --soft:#EEF0F3;
  --easy:#1E9254; --q:#DD5A12; --long:#2D6BD8; --race:#C8303A; --str:#6C4BD8; --ok:#1E9254;
  --warn-bg:#FFF4DB; --warn-ink:#6A4B00;
  --btn:#1A2230; --on-btn:#FFFFFF;
  --font:"Plus Jakarta Sans",ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#11151B; --card:#1A2028; --ink:#E9EDF2; --muted:#9AA5B3; --line:#2A323D; --soft:#222A34;
    --easy:#4CC489; --q:#FF8D52; --long:#72A2FF; --race:#FF6F78; --str:#A58CFF; --ok:#4CC489;
    --warn-bg:#3A3018; --warn-ink:#F6E0A6;
    --btn:#E9EDF2; --on-btn:#11151B;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 90px}
h1,h2,h3,h4{margin:0;line-height:1.2;font-weight:700;letter-spacing:-.015em}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--long);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* tipi di allenamento: colore come testo e sfondo tenue, mai come banda */
.t-easy{--c:var(--easy)}.t-q{--c:var(--q)}.t-long{--c:var(--long)}.t-race{--c:var(--race)}.t-str{--c:var(--str)}
.tint{background:color-mix(in srgb,var(--c) 10%,var(--card))}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}

/* testata */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.top h1{font-size:clamp(28px,5vw,38px)}
.top p{margin:4px 0 0;color:var(--muted);font-size:15px}
.save{font-size:12px;color:var(--muted)}

/* schede */
.tabs{display:flex;gap:4px;margin:18px 0 20px;padding:4px;background:var(--soft);border-radius:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;padding:8px 14px;border-radius:9px;color:var(--muted);white-space:nowrap;font-size:14px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.panel{display:none}.panel.on{display:block}

/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card>h3{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;margin-bottom:10px}
.label{font-size:13px;font-weight:600;color:var(--muted)}

/* oggi */
.today{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:24px}
.hero-s{display:flex;flex-direction:column;gap:10px}
.hs{border-radius:12px;padding:14px 16px}
.hs .k{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--c)}
.hs .tt{font-size:clamp(22px,3.4vw,28px);font-weight:700;margin:4px 0 6px;letter-spacing:-.02em}
.hs .facts{margin:6px 0 10px}
.hs .acts{border:0;padding:0;margin:0}
.nx{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.nx:first-of-type{border-top:0;padding-top:0}
.nx .tt{font-weight:600}
.nx .ts{font-size:13px;color:var(--muted)}
.nx .btn{margin-left:auto;flex:none}
.empty{color:var(--muted);margin:0}

/* settimana */
.wkbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.wkbar h2{font-size:24px}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.wkbar .nav{margin-left:auto;display:flex;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1;display:grid;place-items:center}
.iconbtn:disabled{opacity:.35;cursor:default}
.wkmeta{display:flex;gap:16px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px;margin:6px 0 12px}
.prog{flex:1;min-width:140px;max-width:280px;height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);border-radius:99px}
.wknote{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:15px;max-width:80ch}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{display:flex;flex-direction:column;gap:6px;min-width:0}
.dh{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px;font-size:13px;color:var(--muted)}
.dh b{font-size:17px;color:var(--ink);font-weight:700}
.day.is-today .dh{color:var(--long)}
.day.is-today .dh b{color:#fff;background:var(--long);border-radius:8px;padding:0 7px}
@media (prefers-color-scheme:dark){.day.is-today .dh b{color:#11151B}}
.list{display:flex;flex-direction:column;gap:6px;flex:1}
.rest{font-size:13px;color:var(--muted);padding:10px;border-radius:10px;text-align:center;background:color-mix(in srgb,var(--soft) 60%,transparent)}
.tile{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:10px;padding:9px 10px;position:relative;color:var(--ink)}
.tile:hover{border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.tile .k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--c)}
.tile .t{display:block;font-weight:600;font-size:14px;line-height:1.3;margin:3px 0 2px}
.tile .s{display:block;font-size:12.5px;color:var(--muted)}
.tile .s b{color:var(--ink);font-weight:600;white-space:nowrap}
.tile.opt{background:transparent;border:1px dashed color-mix(in srgb,var(--c) 45%,var(--line))}
.tile.skipped,.tile.away{opacity:.45}.tile.skipped .t,.tile.away .t{text-decoration:line-through}
.tile .chk{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--ok);color:#fff;font-size:11px;display:grid;place-items:center}
.tile .tag{display:inline-block;margin-top:5px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--card);color:var(--q)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* calendario */
.calwrap{overflow-x:auto}
.cal{width:100%;border-collapse:separate;border-spacing:4px;min-width:720px}
.cal th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:0 4px}
.cal td{vertical-align:top;padding:0}
.cal td.wk{white-space:nowrap;padding:4px 8px 4px 0}
.wkbtn{background:none;border:0;padding:4px 6px;border-radius:8px;text-align:left;font-size:12px;color:var(--muted)}
.wkbtn b{display:block;font-size:14px;color:var(--ink)}
.cal tr.cur .wkbtn{background:var(--card);box-shadow:0 0 0 1px var(--line)}
.chip{display:block;width:100%;text-align:left;border:0;border-radius:7px;padding:4px 7px;margin-bottom:3px;font-size:12px;line-height:1.3;color:var(--c);font-weight:600}
.chip.opt{background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 40%,var(--line));font-weight:500}
.chip.done::after{content:" ✓";color:var(--ok)}
.chip.skipped,.chip.away{opacity:.4;text-decoration:line-through}

/* nastro */
.ribbon svg{display:block;width:100%;height:auto}
.rb{cursor:pointer}

/* pettorali */
.bibs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.bib{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink)}
.bib .bn{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted)}
.bib .big{font-size:clamp(30px,5vw,44px);font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:8px 0 2px}
.bib .big small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.bib .tg{font-size:14px;color:var(--muted)}
.bib .tg b{color:var(--ink)}
.bib.goal{border-color:color-mix(in srgb,var(--race) 45%,var(--line))}
.bib.goal .bn span:first-child{color:var(--race)}

/* generici */
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:500}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 35%,var(--line))}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--on-btn);font-weight:600}
.btn.danger{color:var(--race)}
.btn.sm{padding:5px 11px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;width:100%}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 12px}
.note.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
.note b{display:block;margin-bottom:2px}
.note p{margin:2px 0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t th,table.t td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:13px;color:var(--muted);font-weight:600}
.zp{font-size:20px;font-weight:700;white-space:nowrap;letter-spacing:-.02em}
.live{font-size:14px;color:var(--muted);min-height:20px}
.prose{max-width:70ch}
.prose h2{font-size:22px;margin:26px 0 6px}
.prose h2:first-child{margin-top:0}
.prose p{margin:8px 0}
.prose ol,.prose ul{padding-left:22px}
.prose li{margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0 0 18px}
.stats>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stats b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stats span{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--soft);gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
pre{background:var(--soft);border-radius:10px;padding:10px 12px;white-space:pre-wrap;margin:8px 0}
.steps{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px}
.steps div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.steps .rep{font-weight:600;padding-top:6px}

/* blocchi forza */
.blocks{display:flex;flex-direction:column;gap:10px}
.block{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.block .bh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:10px 14px;background:var(--soft)}
.block .bh h4{font-size:15px}
.block .bh span{font-size:13px;color:var(--muted);white-space:nowrap}
.block.focus .bh{background:color-mix(in srgb,var(--str) 12%,var(--card))}
.block .bn{padding:10px 14px 0;font-size:14px;color:var(--muted);margin:0}
.ex{display:grid;grid-template-columns:1fr auto;gap:1px 14px;padding:9px 14px;border-top:1px solid var(--line)}
.bh+.ex,.bn+.ex{border-top:0}
.ex .n{font-weight:600;font-size:15px}
.ex .w{grid-column:1;font-size:12.5px;color:var(--muted)}
.ex .r{grid-row:1/3;grid-column:2;text-align:right;font-size:14px;align-self:center;max-width:230px}

/* pannelli */
dialog{border:0;padding:0;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,14,20,.45)}
dialog.sheet{margin:0 0 0 auto;width:min(560px,100vw);height:100dvh;max-height:100dvh;border-radius:18px 0 0 18px}
dialog.small{width:min(480px,94vw);border-radius:18px}
.dl{padding:20px 22px 28px;overflow:auto;max-height:100%}
.dl .kk{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--c)}
.dl h2{font-size:28px;margin:6px 0 2px;letter-spacing:-.02em}
.dl .when{color:var(--muted);font-size:14px}
.close{position:sticky;top:0;float:right;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.facts div{background:var(--soft);border-radius:10px;padding:7px 12px;min-width:84px}
.tint .facts div{background:var(--card)}
.facts b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em}
.facts span{font-size:12px;color:var(--muted)}
.dl h3{font-size:18px;margin:22px 0 6px}
.dl p{margin:8px 0}
.dl ul{margin:6px 0;padding-left:20px}
.dl li{margin:4px 0}
.pace{font-weight:700;white-space:nowrap}
.logbox{background:color-mix(in srgb,var(--ok) 10%,var(--card));border-radius:10px;padding:10px 12px;margin:12px 0;font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.wlist{margin:8px 0;padding:9px 12px;background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;font-size:14px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

@media (max-width:860px){
  .days{grid-template-columns:1fr;gap:10px}
  .day{flex-direction:row;align-items:flex-start;gap:12px}
  .dh{flex-direction:column;align-items:center;width:44px;flex:none;padding:6px 0 0;gap:0}
  .today,.grid2{grid-template-columns:1fr}
  .bibs{grid-template-columns:1fr}
  dialog.sheet{margin:auto 0 0;width:100vw;max-width:100vw;height:fit-content;max-height:min(92dvh,var(--vvh,100dvh));border-radius:18px 18px 0 0}
}

/* ---------- telefono ---------- */
button,a,input,select,textarea{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.bnav{display:none}
.calm{display:none}
.grab{display:none}
@media (max-width:860px){
  .wrap{padding:calc(14px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}
  .top h1{font-size:22px}
  .top p{font-size:13.5px}
  .top{margin-bottom:10px}
  .tabs{display:none}
  .bnav{display:grid;grid-template-columns:repeat(7,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--muted);font-size:10.5px;font-weight:500}
  .bnav svg{width:23px;height:23px}
  .bnav button[aria-selected="true"]{color:var(--long);font-weight:600}
  .card{padding:14px}
  .today{gap:10px;margin-bottom:16px}
  .hs{padding:12px 14px}
  .hs .acts .btn{flex:1;padding:11px 12px;font-size:15px}
  .wkbar{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -14px 4px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
  .wkbar h2{font-size:20px}
  .wkbar .pill{display:none}
  .wkmeta{margin:8px 0 10px;gap:10px}
  .wkmeta .btn{display:none}
  .wknote{font-size:14px;padding:10px 12px}
  .tile{padding:11px 12px}
  .tile .t{font-size:15px}
  .tile .s{font-size:13px}
  .legend{display:none}
  .swipehint{display:block}
  .calwrap{display:none}
  .calm{display:flex;flex-direction:column;gap:10px}
  .ribbon h3{font-size:12px}
  .btn{padding:10px 14px}
  .btn.sm{padding:7px 12px}
  dialog.small{margin:auto 0 0;width:100vw;max-width:100vw;border-radius:18px 18px 0 0;max-height:92dvh}
  .dl{padding:10px 16px calc(16px + env(safe-area-inset-bottom))}
  .grab{display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
  .dl h2{font-size:24px}
  dialog.sheet{overflow:hidden}
  dialog.sheet[open]{display:flex;flex-direction:column}
  .sheet .dl{max-height:min(92dvh,var(--vvh,100dvh));overflow-y:auto;overscroll-behavior:contain;padding-bottom:0;-webkit-overflow-scrolling:touch}
  .sheet .dl.nobar{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
  .sheet .acts{position:sticky;bottom:0;z-index:3;background:var(--card);margin:18px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);box-shadow:0 -8px 18px rgba(0,0,0,.07)}
  .sheet .acts .btn.primary{flex:1 0 100%;padding:13px;font-size:16px}
  .sheet .acts .btn{flex:1}
  .foot .btn{flex:1;padding:12px}
  .stats{grid-template-columns:1fr 1fr}
  .stats b{font-size:24px}
}
.swipehint{display:none;font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0}
/* calendario per telefono */
.cw{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cw.cur{border-color:var(--long)}
.cwh{display:flex;justify-content:space-between;align-items:baseline;width:100%;background:none;border:0;padding:12px 14px 6px;text-align:left;color:var(--ink)}
.cwh b{font-size:16px}
.cwh span{font-size:13px;color:var(--muted)}
.cr{display:grid;grid-template-columns:50px 10px 1fr auto;gap:8px;align-items:center;width:100%;border:0;background:none;padding:9px 14px;text-align:left;color:var(--ink);border-top:1px solid var(--line);font-size:14.5px}
.cr .d{font-size:12.5px;color:var(--muted)}
.cr .km{font-size:13px;color:var(--muted)}
.cr.opt .n{color:var(--muted)}
.cr.done .n::after{content:" ✓";color:var(--ok);font-weight:700}
.cr.skipped .n,.cr.away .n{text-decoration:line-through;opacity:.5}
.cs{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px 12px;border-top:1px solid var(--line)}
.cs .chip{width:auto;margin:0;padding:5px 9px}

/* ---------- restyling ---------- */
:root{--shadow:0 1px 2px rgba(20,30,50,.05),0 8px 24px -12px rgba(20,30,50,.14);--r:18px}
@media (prefers-color-scheme:dark){:root{--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6)}}
body{background:radial-gradient(900px 420px at 85% -80px,color-mix(in srgb,var(--str) 14%,transparent),transparent 70%),radial-gradient(700px 380px at -10% -60px,color-mix(in srgb,var(--q) 12%,transparent),transparent 70%),var(--bg);background-attachment:fixed;font-weight:450}
h1,h2,h3,h4{letter-spacing:-.025em;font-weight:700}
.card,.bib,.stats>div,.note,.block,.cw,.wknote{border-radius:var(--r);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--line) 70%,transparent)}
.card>h3{text-transform:uppercase;font-size:11.5px;letter-spacing:.08em;font-weight:700}
.btn{border-radius:12px;font-weight:600}
.btn.primary{background:linear-gradient(135deg,var(--q),var(--race) 55%,var(--str));border:0;color:#fff}
.tabs{box-shadow:var(--shadow);background:color-mix(in srgb,var(--card) 75%,var(--soft))}
.tabs button{font-weight:600}
.tabs button[aria-selected="true"]{background:linear-gradient(135deg,var(--q),var(--race) 55%,var(--str));color:#fff;box-shadow:0 4px 12px -4px color-mix(in srgb,var(--race) 60%,transparent)}
@media (max-width:860px){.bnav button[aria-selected="true"]{color:var(--race)}}

/* testata: solo nella home */
.hero{padding:6px 0 18px}
.hero h1{font-size:clamp(76px,22vw,132px);font-weight:800;line-height:.95;letter-spacing:-.055em;margin:0;width:fit-content;padding-right:.06em;
  background:linear-gradient(115deg,#FF8A00 0%,#FF3D6E 35%,#B13CFF 68%,#2D8CFF 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.hero .sub{margin:8px 0 14px;font-size:clamp(13px,3.4vw,16px);color:var(--muted);font-weight:500;letter-spacing:.01em}
.cd{display:flex;align-items:center;gap:12px;width:fit-content;max-width:100%;background:var(--card);border-radius:99px;padding:8px 16px 8px 8px;box-shadow:var(--shadow)}
.cd .ring{width:44px;height:44px;flex:none}
.cd b{font-size:20px;font-weight:800;letter-spacing:-.03em}
.cd span{font-size:13px;color:var(--muted);font-weight:600}
.save{font-size:12px;color:var(--muted);margin:0 0 12px}

/* anello di avanzamento */
.ringcard{display:flex;align-items:center;gap:16px}
.ringcard .big-ring{width:92px;height:92px;flex:none}
.ringcard .rt b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.ringcard .rt span{font-size:13px;color:var(--muted);font-weight:600}
.rcol{display:flex;flex-direction:column;gap:14px}
.today>*,.rcol>*{min-width:0}
html,body{overflow-x:hidden}

/* icone di tipo */
.ico{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hs{border-radius:16px}
.hs .k,.tile .k,.dl .kk{text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.tile{border-radius:14px}
.tile .t{font-size:14px}
.wkbar h2{font-size:22px}
.wknote{padding:0;overflow:hidden}
.wknote summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:14px;color:var(--muted);list-style:none}
.wknote summary::-webkit-details-marker{display:none}
.wknote summary::after{content:"+";float:right;font-weight:700}
.wknote[open] summary::after{content:"−"}
.wknote p{margin:0;padding:0 14px 12px;font-size:14px}
.det{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:14px 0}
.det>summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style:none}
.det>summary::-webkit-details-marker{display:none}
.det>summary::after{content:"+";float:right;color:var(--muted)}
.det[open]>summary::after{content:"−"}
.det>div{padding:0 16px 14px}
.prog{height:8px}
.prog i{background:linear-gradient(90deg,var(--q),var(--race),var(--str))}

/* ritmi: barre di velocità */
.zrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.zrow .zn{font-weight:700}
.zrow .zd{grid-column:1/-1;font-size:13px;color:var(--muted)}
.zrow .zb{grid-column:1/-1;height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.zrow .zb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--easy),var(--long) 40%,var(--q) 75%,var(--race))}
.bib .big{background:linear-gradient(115deg,var(--q),var(--race),var(--str));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.bib .big small{-webkit-text-fill-color:var(--muted)}

/* calendario mensile */
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.mhead h2{font-size:24px;text-transform:capitalize;margin-right:auto}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mw{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:center;padding:2px 0 4px}
.mc{background:var(--card);border-radius:14px;box-shadow:var(--shadow);min-height:104px;padding:7px;display:flex;flex-direction:column;gap:4px;cursor:pointer;border:2px solid transparent;min-width:0;text-align:left}
.mc.empty{background:none;box-shadow:none;cursor:default}
.mc .mn{font-size:13px;font-weight:700;color:var(--muted);width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.mc.today .mn{background:linear-gradient(135deg,var(--q),var(--race));color:#fff}
.mc.sel{border-color:var(--race)}
.mc.rest-d{background:color-mix(in srgb,var(--card) 55%,transparent);box-shadow:none}
.mi{display:flex;flex-direction:column;gap:3px}
.mi .chip{margin:0;padding:3px 6px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md{display:none;gap:3px;flex-wrap:wrap}
.md .dot{width:7px;height:7px}
.dday{margin-top:16px}
.dday h3{font-size:16px;margin-bottom:10px;text-transform:capitalize}
.dday .tile{margin-bottom:8px}
@media (max-width:860px){
  .hero{padding-top:0}
  .mgrid{gap:4px}
  .mc{min-height:58px;padding:5px;align-items:center;border-radius:12px}
  .mi{display:none}
  .md{display:flex;justify-content:center}
  .mhead h2{font-size:20px}
  .ringcard .big-ring{width:76px;height:76px}
}

/* nutrizione e forza */
.tline{position:relative;padding-left:6px}
.tline::before{content:"";position:absolute;left:12px;top:10px;bottom:10px;width:3px;border-radius:3px;background:linear-gradient(var(--easy),var(--long),var(--q),var(--race))}
.tl{position:relative;display:grid;grid-template-columns:92px 1fr;gap:2px 10px;padding:8px 0 8px 22px}
.tdot{position:absolute;left:1px;top:14px;width:13px;height:13px;border-radius:50%;background:var(--card);border:3px solid var(--long)}
.tl.caf .tdot{border-color:var(--q)}.tl.fin .tdot{border-color:var(--race);background:var(--race)}
.tw{font-weight:800;font-size:16px;letter-spacing:-.02em}
.tw small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:0}
.tx{align-self:center;font-size:14.5px}
.tchips{grid-column:2;display:flex;gap:6px;flex-wrap:wrap}
.cp{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft)}
.cp.g{background:color-mix(in srgb,var(--long) 14%,var(--card));color:var(--long)}
.cp.c{background:color-mix(in srgb,var(--q) 14%,var(--card));color:var(--q)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.bars{display:flex;align-items:flex-end;gap:12px;height:130px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar i{display:block;width:100%;border-radius:10px 10px 4px 4px;background:linear-gradient(var(--q),var(--race))}
.bv{font-weight:800;font-size:14px}.bl{font-size:12px;color:var(--muted);font-weight:600}
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:12px;background:color-mix(in srgb,var(--c,var(--muted)) 12%,var(--card));color:var(--c,var(--muted));border:2px solid transparent;text-align:center}
.wd.off{background:var(--soft)}.wd.me{border-color:var(--c)}
.wd .wn{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.wd .wi{height:18px;display:grid;place-items:center}
.wd .wl{font-size:11.5px;font-weight:700;color:var(--ink)}
.sbar{display:flex;gap:3px;height:12px}
.sbar i{border-radius:6px;min-width:6px}
.ex .r{background:var(--soft);padding:4px 12px;border-radius:12px;font-weight:700;text-align:center}
.block .bh{background:none;border-bottom:1px solid var(--line)}
.block .bh h4::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--str);margin-right:8px}
.block.focus .bh h4::before{background:var(--race)}
.block.focus .bh span::before{content:"Anti-periostite · ";color:var(--race);font-weight:700}
.block.focus{border-color:color-mix(in srgb,var(--race) 40%,var(--line))}
.wstat{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.wstat b{display:block}
.wdot{width:12px;height:12px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
.wdot.busy{background:var(--q);box-shadow:0 0 0 4px color-mix(in srgb,var(--q) 22%,transparent)}
.wdot.bad{background:var(--race);box-shadow:0 0 0 4px color-mix(in srgb,var(--race) 22%,transparent)}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:700;margin-bottom:14px}
.flow span{background:var(--soft);padding:4px 10px;border-radius:99px}
.flow i{font-style:normal;color:var(--muted)}
@media (max-width:860px){.bnav button{font-size:9.5px}.tl{grid-template-columns:70px 1fr}.wd .wl{font-size:10px}}

/* ---------- interazioni, pannelli, dati dell'allenamento ---------- */
.tile,.chip,.mc{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.dl{--px:22px;--pt:20px}
.sh{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:flex-end;margin:calc(var(--pt)*-1) calc(var(--px)*-1) 8px;padding:12px var(--px) 8px;background:var(--card);min-height:56px}
.sh .gr{display:none;position:absolute;left:50%;top:8px;width:42px;height:5px;border-radius:3px;background:var(--line);transform:translateX(-50%)}
.sh .cl{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--soft);color:var(--ink);border-radius:99px;padding:9px 14px 9px 16px;font-size:14px;font-weight:700}
.sh .cl .ico{width:14px;height:14px}
#smallIn{padding:0;display:flex;flex-direction:column;min-height:0;overflow:hidden}
dialog.small[open]{display:flex;flex-direction:column}
dialog.small{max-height:90dvh}
.fh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex:none;background:var(--card)}
.fh .ft{font-size:16px;text-align:center;font-weight:700}
.fh .fb{border:0;background:none;font-size:16px;font-weight:600;padding:10px 8px;color:var(--muted);justify-self:start}
.fh .fb.pri{justify-self:end;color:var(--race);font-weight:800}
.fbody{padding:14px 18px 26px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0;overscroll-behavior:contain}
.fbody .when{margin:0 0 8px;color:var(--muted);font-size:14px}
@keyframes rise{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:860px){
  .dl{--px:16px;--pt:10px}
  .sh{padding-top:22px}
  .sh .gr{display:block}
  dialog.small{position:fixed;inset:var(--vvt,0px) 0 auto 0;margin:0;width:100vw;max-width:100vw;height:var(--vvh,100dvh);max-height:var(--vvh,100dvh);border-radius:0;animation:rise .22s ease-out}
  .fh{padding-top:calc(10px + env(safe-area-inset-top))}
  .fbody{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
  .fbody input,.fbody select,.fbody textarea{font-size:16px}
  .bnav{grid-template-columns:repeat(6,1fr);transform:translate3d(0,0,0);-webkit-transform:translate3d(0,0,0);will-change:transform}
  .bnav button{font-size:10.5px}
  .wrap{min-height:100vh;min-height:100dvh}
  .sheet .acts .btn:not(.primary){padding:9px 6px;font-size:13px;min-width:0}
  .sheet .acts{gap:6px}
}
.sheet .acts{align-items:stretch}

/* riepiloghi: valori in elenco chiaro, non riquadri affiancati */
.facts{display:grid;grid-template-columns:1fr;gap:0;margin:8px 0}
.facts div,.tint .facts div{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 2px;background:none;border-radius:0;border-bottom:1px solid var(--line);min-width:0}
.facts div:last-child{border-bottom:0}
.facts b{font-size:16px;white-space:nowrap;text-align:right}
.facts span{font-size:13.5px;color:var(--muted);flex:1}
@media (min-width:520px){.sec .facts{grid-template-columns:1fr 1fr;column-gap:28px}.sec .facts div:nth-last-child(2):nth-child(odd){border-bottom:0}}
.hs .facts,.shero .facts{display:flex;flex-wrap:wrap;gap:8px 26px;margin:12px 0 4px}
.hs .facts div,.shero .facts div,.tint .hs .facts div{display:block;border:0;padding:0}
.hs .facts b,.shero .facts b{display:block;font-size:22px;letter-spacing:-.02em;text-align:left}
.hs .facts span,.shero .facts span{display:block;font-size:12px}
.shero{border-radius:20px;padding:16px 16px 12px;margin-top:2px}
.shero h2{font-size:26px;margin:6px 0 2px}
.shero .kk{display:flex;align-items:center}
.stb{margin-left:auto;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--ok);color:#fff;letter-spacing:.04em;text-transform:none}
.sec{margin:14px 0 0;padding:16px;border-radius:var(--r);background:color-mix(in srgb,var(--soft) 55%,var(--card))}
.sec.res{background:color-mix(in srgb,var(--ok) 9%,var(--card))}
.sl{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.hero3{display:grid;grid-template-columns:repeat(3,1fr);margin:4px 0 6px}
.hero3>div{padding:2px 0 2px 14px;border-left:1px solid var(--line);min-width:0}
.hero3>div:first-child{border-left:0;padding-left:0}
.hero3 b{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.hero3>div:last-child b{background:linear-gradient(115deg,var(--q),var(--race),var(--str));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.hero3 span{font-size:12.5px;color:var(--muted);font-weight:600}
.cmp{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.cmp b{color:var(--ink)}
.dl2{font-weight:700;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--ink)}
.dl2.up{color:var(--ok)}
.tip{margin:0;font-size:14.5px;line-height:1.55;padding-left:12px;border-left:3px solid color-mix(in srgb,var(--c,var(--muted)) 60%,transparent)}
.prof{display:block;width:100%;height:64px;margin-bottom:6px}
.proflg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);font-weight:600;align-items:center}
.proflg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.stps{margin-top:12px;display:flex;flex-direction:column}
.stp{display:grid;grid-template-columns:5px 1fr auto auto;gap:10px;align-items:center;padding:7px 0}
.stp i{width:5px;height:26px;border-radius:3px}
.stp .sn{font-weight:600;font-size:14.5px}
.stp .sd{font-size:13px;color:var(--muted)}
.stp .sp2{font-size:13.5px;background:var(--card);padding:3px 10px;border-radius:99px}
.stp .sp2 small{font-size:10.5px;color:var(--muted);font-weight:600}
.rep{border:1.5px solid var(--line);border-radius:14px;padding:2px 12px;margin:6px 0;background:color-mix(in srgb,var(--card) 70%,transparent)}
.rep .rh{display:flex;gap:8px;align-items:baseline;padding:8px 0 0;font-size:12px;color:var(--muted);font-weight:700}
.rep .rh b{font-size:16px;color:var(--ink)}
.gels{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 12px}
.pd{display:grid;gap:10px;margin-top:6px}
.pd div{display:flex;flex-direction:column;font-size:14px}
.pd b{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.sec .tline{margin-top:6px}
.blocks{counter-reset:bk}
.block .bh h4::before{content:counter(bk);counter-increment:bk;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--str);color:#fff;font-size:12px;font-weight:800;margin-right:9px;vertical-align:1px}
.block.focus .bh h4::before{background:var(--race)}

/* dati */
.dstack{display:flex;flex-direction:column;gap:14px}
.dstack .card{margin:0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc2{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:16px 10px}
.rc2 .big-ring{width:84px;height:84px}
.rc2 b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em}
.rc2 span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.wkc{display:block;width:100%;height:auto}
.wkrow{display:flex;align-items:flex-start}
.wkax{flex:none;display:block}
.wkscroll{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none}
.wkscroll::-webkit-scrollbar{display:none}
.wkc2{display:block;max-width:none}
#watch{margin-top:14px}
.pr{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pr.hd{border-top:0;padding:0 0 4px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.pr .r{text-align:right}
.pr .pn{font-weight:700;font-size:15px}
.pr b{display:block;font-size:19px;letter-spacing:-.02em}
.pr small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.pr .g b{color:var(--race)}
.sp2r{display:grid;grid-template-columns:128px 1fr;gap:12px;align-items:center;padding:8px 0}
.sp2r .kl{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.sp2r b{display:block;font-size:22px;letter-spacing:-.02em}
.sp2r b small{font-size:12px;color:var(--muted);margin-left:3px}
.sp2r span.up{color:var(--ok)}
.sp2r>div>span:last-child{font-size:12px;color:var(--muted);font-weight:600}
.spk{width:100%;height:46px}
.tools{padding:12px 14px}
.trow{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-height:20px}
.tools .wdot{width:10px;height:10px}
.tbtns{display:flex;gap:8px;flex-wrap:wrap}
.tbtns .btn{flex:1;text-align:center;white-space:nowrap}
.abs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.abs input{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
.abs #aNote{grid-column:1/2}
.abs .btn{grid-column:2/3}
.achips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.achips .cp button{border:0;background:none;font-size:16px;line-height:1;margin-left:4px;color:var(--muted);padding:0 2px}

dialog.sheet .dl{padding-top:0}
dialog.sheet .sh{margin-top:0}
/* dashboard */
html,body{overscroll-behavior-y:none}
.dsec{margin:26px 0 10px;font-size:20px}
.dsec:first-child{margin-top:0}
.dtop{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.dtop .big-ring{width:104px;height:104px}
.dtop .rt b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.dtop .rt span{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.kpi .kl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .kv{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:4px 0 8px}
.kpi .kv small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:3px}
.kpi .kb{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.kpi .kb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--q),var(--race),var(--str))}
.kpi .kc{font-size:12.5px;color:var(--muted);margin-top:7px}
@media (max-width:860px){.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:12px 14px}.kpi .kv{font-size:22px}}
.dlist{margin-top:0}

/* toast */
.toast{position:fixed;top:auto;right:auto;margin:0;border:0;overflow:visible;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:200;background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 14px;width:max-content;max-width:min(92vw,460px);box-shadow:0 12px 32px rgba(0,0,0,.3);font-size:14px;font-weight:600;transition:opacity .2s,transform .2s;display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:var(--q);font-weight:800;font-size:14px;padding:6px}
.toast .tw2{font-size:12.5px;opacity:.8;display:block;margin-top:2px;font-weight:500}

/* trascinamento */
.drag-src{opacity:.3}
.lp-pre{transform:scale(.97);transition:transform .35s}
.dgh{position:fixed;z-index:300;pointer-events:none;width:160px;border-radius:12px;padding:8px 10px;background:var(--card);box-shadow:0 14px 34px rgba(0,0,0,.3);border:2px solid var(--c);font-size:13px;font-weight:700;transform:translate(-50%,-70%) scale(1.04);color:var(--ink);line-height:1.3}
.dgh span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.drop-on{outline:3px solid var(--race);outline-offset:-3px;background:color-mix(in srgb,var(--race) 12%,var(--card))!important}
.day{border-radius:14px}
body.dragging{touch-action:none;overscroll-behavior:none}
body.dragging *{-webkit-user-select:none!important;user-select:none!important}
.draghint{font-size:12px;color:var(--muted);margin:8px 2px 0}

/* sposta: giorni della settimana */
.mvh{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.mvd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mvb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;border-radius:14px;border:2px solid transparent;background:var(--soft);font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.mvb b{font-size:18px;color:var(--ink)}
.mvb.cur{border-color:var(--line)}
.mvb.sel{border-color:var(--race);background:color-mix(in srgb,var(--race) 10%,var(--card))}
.mvb.td b{color:var(--long)}
.mvdots{display:flex;gap:3px;height:7px}
.mvmore{margin-top:14px;font-size:14px}
.mvmore summary{cursor:pointer;color:var(--muted);font-weight:600}

/* dati dell'allenamento */
.sp{display:grid;grid-template-columns:30px 46px 1fr 34px 38px;gap:8px;align-items:center;padding:5px 0;font-size:14px}
.sp.hd{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sp .r{text-align:right}
.sp .pc{font-weight:700}
.sp .sb{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.sp .sb i{display:block;height:100%;border-radius:6px;background:var(--long)}
.sp.best .sb i{background:var(--q)}
.chw{position:relative;margin-top:6px}
.chw .cl2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 0}
.lc{display:block;width:100%;height:auto;touch-action:pan-y}
.rd{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);min-height:22px;align-items:center}
.rd b{color:var(--ink)}
.zbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.zbar i{display:block;min-width:3px}
.zl{display:grid;grid-template-columns:12px 1fr auto auto;gap:6px 10px;font-size:13.5px;margin-top:10px;align-items:center}
.zl .sw{width:10px;height:10px;border-radius:3px}
.lap{display:grid;grid-template-columns:1fr 54px 56px 54px 36px;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.lap.hd{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:0}
.lap .r{text-align:right}
.lr{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;width:100%;border:0;background:none;padding:12px 14px;text-align:left;color:var(--ink);border-top:1px solid var(--line)}
.lr:first-child{border-top:0}
.lr .d{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.25}
.lr .n{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px}
.lr .m{font-size:13px;color:var(--muted)}
.lr .bd{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.lrs{margin-top:14px;overflow:hidden;padding:0}
.hint{font-size:13px;color:var(--muted);margin:6px 0}
.how{display:grid;gap:8px;margin:4px 0 12px}
.how div{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;font-size:14px}
.how b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--soft);font-size:12px}
/* azioni dell'allenamento: pulsante principale sempre in vista, le altre azioni in una griglia ordinata */
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.acts2 .btn{width:100%;min-width:0;padding:11px 8px;font-size:14px;line-height:1.2;white-space:normal;text-align:center}
.acts2 .btn.wide{grid-column:1/-1}
.acts2+.acts{margin-top:14px}

/* ===== rifinitura grafica e animazioni ===== */
:root{--shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06);--ease:cubic-bezier(.22,.8,.24,1)}
@media (prefers-color-scheme:dark){:root{--shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.28)}}
html{scroll-behavior:smooth}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,.hs,.nx,.rc,.tile,.chip,.mc{-webkit-user-select:none;user-select:none;touch-action:manipulation}
.card{border-radius:20px;box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--line) 70%,transparent)}
.hs,.tile{border-radius:16px}
.btn,.iconbtn,.seg button,.tabs button,.bnav button{transition:transform .2s var(--ease),background-color .2s,color .2s,box-shadow .2s,opacity .2s}
.hs,.nx,.rc,.tile,.chip,.mc,.bib,.ringcard{transition:transform .22s var(--ease),box-shadow .25s,background-color .2s,border-color .2s;cursor:pointer}
.btn:active,.iconbtn:active,.hs:active,.nx:active,.rc:active,.tile:active,.chip:active,.bib:active,.ringcard:active,.seg button:active{transform:scale(.97)}
@media (hover:hover){.hs:hover,.rc:hover,.tile:hover,.bib:hover,.ringcard:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(16,24,40,.12)}.nx:hover{background:var(--soft)}}

/* schede: pillola che segue la selezione, icone che rimbalzano */
.tabs{background:color-mix(in srgb,var(--soft) 85%,transparent);border-radius:14px}
.tabs button[aria-selected="true"]{box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bnav button[aria-selected="true"] svg{animation:pop .42s var(--ease)}
.bnav button svg{transition:transform .25s var(--ease)}
@keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ingresso delle schede: solo quando si cambia pagina */
@keyframes rise2{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.panel.enter>*{animation:fadeIn .3s ease both}
.panel.enter .card,.panel.enter .hs,.panel.enter .rc,.panel.enter .day,.panel.enter .bib,.panel.enter .block,.panel.enter .note{animation:rise2 .55s var(--ease) both}
.panel.enter .card:nth-child(2),.panel.enter .rc:nth-child(2),.panel.enter .block:nth-child(2),.panel.enter .bib:nth-child(2){animation-delay:.06s}
.panel.enter .card:nth-child(3),.panel.enter .rc:nth-child(3),.panel.enter .block:nth-child(3),.panel.enter .bib:nth-child(3){animation-delay:.12s}
.panel.enter .card:nth-child(4),.panel.enter .block:nth-child(4){animation-delay:.18s}
.panel.enter .card:nth-child(n+5),.panel.enter .block:nth-child(n+5){animation-delay:.24s}
.panel.enter .prog i,.panel.enter .rp i{transform-origin:left;animation:growX .9s var(--ease) .15s both}
.panel.enter .ring circle:nth-of-type(2),.panel.enter .big-ring circle:nth-of-type(2){animation:ringIn 1s var(--ease) .1s both}
@keyframes ringIn{from{stroke-dasharray:0 999}}
.panel.enter .wkc2 rect,.panel.enter .wkc rect{transform-box:fill-box;transform-origin:bottom;animation:growY .7s var(--ease) both}
@keyframes growY{from{transform:scaleY(.02);opacity:.4}to{transform:none;opacity:1}}

/* schede a comparsa: scorrono dal basso con dissolvenza */
dialog[open]{animation:sheetUp .42s var(--ease)}
dialog[open]::backdrop{animation:fadeIn .3s ease}
@keyframes sheetUp{from{transform:translateY(32px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:861px){dialog.sheet[open]{animation:sheetIn .42s var(--ease)}@keyframes sheetIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}}
.toast.on{animation:rise2 .35s var(--ease)}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.hcol{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:900px){.home{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.hero .sub{margin:2px 0 0;font-size:15px;color:var(--muted);font-weight:600;text-transform:capitalize}
.hs{cursor:pointer;position:relative}
.hs .k{justify-content:flex-start}
.chev{width:18px;height:18px;flex:none;margin-left:auto;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.45;transition:transform .25s var(--ease),opacity .2s}
.hs:hover .chev,.nx:hover .chev,.ringcard:hover .chev{transform:translateX(3px);opacity:.8}
.hs .qa{margin-top:10px}
.nx{border-radius:12px;padding:12px 8px;margin:0 -8px;cursor:pointer}
.nx .nxb{min-width:0;flex:1}
.nx .dot{width:10px;height:10px}
.ringcard{width:100%;text-align:left;color:var(--ink);font:inherit}
.ringcard .rt{flex:1;min-width:0}

/* timer gare */
.rtm{display:flex;flex-direction:column;gap:12px}
.rc{border-radius:20px;padding:16px 18px;background:var(--card);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:var(--shadow);position:relative;overflow:hidden}
.rc.goal{border-color:transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(120deg,#FF8A00,#FF3D6E 50%,#B13CFF) border-box;border:1.5px solid transparent}
.rc .rh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;font-weight:700;color:var(--muted)}
.rc .rn{color:var(--ink);font-size:15px;letter-spacing:-.01em}
.rc .cdn{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 12px}
.rc .cdn div{background:var(--soft);border-radius:14px;padding:9px 4px 7px;text-align:center}
.rc .cdn b{display:block;font-size:clamp(22px,6.4vw,30px);font-weight:800;letter-spacing:-.03em;line-height:1.1;background:linear-gradient(115deg,var(--q),var(--race),var(--str));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.rc .cdn span{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.rc .rdone{margin:12px 0;padding:14px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;gap:2px}
.rc .rdone b{font-size:28px;font-weight:800;letter-spacing:-.03em}
.rc .rdone span{font-size:13px;color:var(--muted);font-weight:600}
.rc .rp{height:5px;border-radius:99px;background:var(--soft);overflow:hidden}
.rc .rp i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FF8A00,#FF3D6E,#B13CFF)}
.rc .rg{margin-top:9px;font-size:13px;color:var(--muted)}
.rc .rg b{color:var(--ink)}
.rc.past{opacity:.8}
@media (max-width:899px){
  .rtm{flex-direction:row;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:0 -20px;padding:2px 20px 10px;scrollbar-width:none}
  .rtm::-webkit-scrollbar{display:none}
  .rc{flex:0 0 84%;scroll-snap-align:center}
}

/* calendario: interruttore mese / settimana */
.calbar{display:flex;justify-content:flex-end;margin:0 0 12px}
#p-cal[data-mode="month"] #week{display:none}
#p-cal[data-mode="week"] #cal{display:none}

/* dati: intestazione con interruttore */
.chhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}

/* forza: descrizione dell'esercizio */
.ex .d{grid-column:1;font-size:12.5px;line-height:1.4;color:var(--muted);margin-top:3px;max-width:60ch}
.ex .r{grid-row:1/span 3}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script>
(function(){
"use strict";
const KEY='mezza130-niccolo-v1';
const W0='2026-10-19';
const NWEEKS=27;
const HM_KM=21.0975;
const RACES=[
  {id:'napoli',short:'Napoli',name:'Napoli City Half Marathon',date:'2027-02-21',cls:'n'},
  {id:'milano',short:'Milano',name:'Stramilano',date:'2027-03-21',cls:'m'},
  {id:'conero',short:'Conero',name:'Conero Running',date:'2027-04-25',cls:'c'}
];
const KIND={
  easy:{label:'Facile',cls:'easy',run:1,color:'var(--easy)'},
  q:{label:'Qualità',cls:'q',run:1,color:'var(--q)'},
  long:{label:'Lungo',cls:'long',run:1,color:'var(--long)'},
  race:{label:'Gara',cls:'race',run:1,color:'var(--race)'},
  upper:{label:'Forza upper',cls:'str',str:1,color:'var(--str)'},
  lower:{label:'Forza lower',cls:'str',str:1,color:'var(--str)'},
  travel:{label:'Circuito',cls:'str',str:1,color:'var(--str)'}
};
KIND.upperA=KIND.upper;KIND.upperB=KIND.upper;
const PH_NAME={base:'Base',build:'Costruzione',spec:'Specifico',rest:'Recupero',taper:'Tapering'};
const PH_COLOR={base:'var(--easy)',build:'var(--long)',spec:'var(--q)',rest:'var(--rest)',taper:'var(--str)'};

const pad=n=>String(n).padStart(2,'0');
const toD=s=>{const a=s.split('-').map(Number);return Date.UTC(a[0],a[1]-1,a[2]);};
const toS=t=>new Date(t).toISOString().slice(0,10);
const add=(s,n)=>toS(toD(s)+n*864e5);
const diff=(a,b)=>Math.round((toD(b)-toD(a))/864e5);
const todayS=()=>{const n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate());};
const WD=['dom','lun','mar','mer','gio','ven','sab'];
const WDL=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const MO=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const MOL=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const dd=s=>new Date(toD(s));
const fmtDay=s=>{const d=dd(s);return WD[d.getUTCDay()]+' '+d.getUTCDate()+' '+MO[d.getUTCMonth()];};
const fmtLong=s=>{const d=dd(s);return WDL[d.getUTCDay()]+' '+d.getUTCDate()+' '+MOL[d.getUTCMonth()];};
const fmtShort=s=>{const d=dd(s);return d.getUTCDate()+' '+MO[d.getUTCMonth()];};
const weekOf=s=>Math.floor(diff(W0,s)/7);
const LAST=add(W0,NWEEKS*7-1);
const clampW=i=>Math.max(0,Math.min(NWEEKS-1,i));

const mss=sec=>{sec=Math.round(sec);return Math.floor(sec/60)+':'+pad(sec%60);};
const hms=sec=>{sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?h+':'+pad(m)+':'+pad(s):m+':'+pad(s);};
function parseTime(t){
  if(!t)return NaN;t=String(t).trim().replace(/[.,]/g,':');
  const p=t.split(':').map(Number);if(p.some(isNaN))return NaN;
  if(p.length===3)return p[0]*3600+p[1]*60+p[2];

let storageMode='none'; // 'claude' dentro Claude, 'local' nel browser, 'none' se non disponibile
async function load(){
  try{
    if(window.storage&&window.storage.get){
      storageMode='claude';
      try{const r=await window.storage.get(KEY,false);if(r&&r.value)state=Object.assign(DEFAULT(),JSON.parse(r.value));}catch(e){}
    }else{
      localStorage.setItem(KEY+':test','1');localStorage.removeItem(KEY+':test');
      storageMode='local';
      try{const raw=localStorage.getItem(KEY);if(raw)state=Object.assign(DEFAULT(),JSON.parse(raw));}catch(e){}
    }
  }catch(e){storageMode='none';}
  storageOK=storageMode!=='none';
  migrate();
  setSave(storageMode==='claude'?'Salvataggio automatico attivo':storageMode==='local'?'Salvato su questo dispositivo':'Salvataggio non disponibile: esporta un backup');
  if(storageMode==='local'){
    await sbHash();
    if(sb.ses){await Promise.race([sbInit(),new Promise(res=>setTimeout(res,6000))]);}
  }
}
function migrate(){
  (state.custom||[]).forEach(c=>{if(c.kind==='upperA'||c.kind==='upperB')c.kind='upper';});
  if(!state.tg)state.tg={napoli:5820,milano:5640,conero:Math.round(state.rg*HM_KM)};
  if(state.cal&&state.cal.length===1&&state.cal[0].sec===6211){state.cal[0]={date:'2026-10-18',label:'Mezza di Roma (ufficiale)',dist:HM_KM,sec:6205};state.hm=6205/HM_KM;}
  if(typeof state.updatedAt!=='number')state.updatedAt=0;

}

/* indirizzo del progetto e chiave pubblica non stanno nel codice: si inseriscono una volta per dispositivo e restano solo qui */
const SB_CFG=KEY+':sbcfg';
const SB_SES=KEY+':sb';
const sb={cfg:null,ses:null,ready:false,busy:false,again:false,last:0,err:'',t:null};
try{sb.cfg=JSON.parse(localStorage.getItem(SB_CFG)||'null');if(!sb.cfg||!sb.cfg.url||!sb.cfg.key)sb.cfg=null;}catch(e){}
try{sb.ses=sb.cfg?JSON.parse(localStorage.getItem(SB_SES)||'null'):null;}catch(e){}
function sbSave(x){sb.ses=x;try{if(x)localStorage.setItem(SB_SES,JSON.stringify(x));else localStorage.removeItem(SB_SES);}catch(e){}}
function sbSession(j){
  const u=j.user||{};
  sbSave({at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000-60000,uid:u.id||(sb.ses&&sb.ses.uid),email:u.email||(sb.ses&&sb.ses.email)});
}
const sbH=extra=>Object.assign({apikey:sb.cfg.key,'Content-Type':'application/json'},extra||{});
async function sbToken(){
  if(!sb.ses)throw {status:401};
  if(Date.now()<sb.ses.exp)return sb.ses.at;
  const r=await fetch(sb.cfg.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:sbH(),body:JSON.stringify({refresh_token:sb.ses.rt})});
  if(!r.ok){if(r.status>=400&&r.status<500)sbSave(null);throw {status:401};}
  sbSession(await r.json());return sb.ses.at;
}
async function sbRest(path,method,body,extra){
  const tok=await sbToken();
  return fetch(sb.cfg.url+'/rest/v1'+path,{method:method||'GET',cache:'no-store',headers:sbH(Object.assign({Authorization:'Bearer '+tok},extra||{})),body:body?JSON.stringify(body):undefined});
}
function sbErrText(e){
  const s=e&&e.status;
  if(s===401)return 'Accesso scaduto: accedi di nuovo.';
  if(s===404||s===406)return 'Tabelle non trovate: esegui lo script SQL sul progetto.';
  if(s)return 'Il servizio ha risposto con errore '+s+'.';
  return 'Non riesco a contattare il servizio: controlla la connessione.';
}
/* ritorno dal link di accesso ricevuto via email: i token arrivano nell'indirizzo */
async function sbHash(){
  if(!/access_token=|error_description=/.test(location.hash))return;
  const q=new URLSearchParams(location.hash.slice(1));history.replaceState(null,'',location.pathname+location.search);
  if(!sb.cfg)return;
  if(q.get('error_description')){sb.err=q.get('error_description').replace(/\+/g,' ');return;}
  try{
    const at=q.get('access_token'),r=await fetch(sb.cfg.url+'/auth/v1/user',{headers:sbH({Authorization:'Bearer '+at})});
    if(!r.ok)throw {status:r.status};
    sbSession({access_token:at,refresh_token:q.get('refresh_token'),expires_in:+q.get('expires_in')||3600,user:await r.json()});
  }catch(e){sb.err=sbErrText(e);}
}
async function sbPull(){
  const r=await sbRest('/app_state?select=state');
  if(!r.ok)throw {status:r.status};
  const rows=await r.json();return rows[0]?rows[0].state:null;
}
function sbOk(){sb.last=Date.now();sb.ready=true;sb.err='';setSave('Salvato nel tuo account alle '+hhmm(sb.last));}
async function sbPush(){
  if(!sb.ses)return;
  if(!sb.ready){setSave('Non sincronizzato: riprovo appena torna la connessione');return;}
  if(sb.busy){sb.again=true;return;}
  sb.busy=true;setSave('Salvataggio nel tuo account…');
  try{
    const r=await sbRest('/app_state?on_conflict=user_id','POST',{user_id:sb.ses.uid,state,updated_at:new Date().toISOString()},{Prefer:'resolution=merge-duplicates,return=minimal'});
    if(!r.ok)throw {status:r.status};
    sbOk();
  }catch(e){sb.err=sbErrText(e);setSave('Non sincronizzato: '+sb.err);}
  finally{sb.busy=false;if(sb.again){sb.again=false;sbSchedule();}}
}
function sbSchedule(){clearTimeout(sb.t);setSave('Salvataggio nel tuo account…');sb.t=setTimeout(sbPush,1200);}
async function sbInit(){
  if(!sb.ses)return;
  setSave('Sincronizzazione…');
  try{
    const rem=await sbPull();sb.ready=true;
    if(!rem||!rem.hm)await sbPush();
    else if((rem.updatedAt||0)>(state.updatedAt||0)){adopt(rem);sbOk();}
    else if((state.updatedAt||0)>(rem.updatedAt||0))await sbPush();
    else sbOk();
    sbActs();
  }catch(e){sb.ready=false;sb.err=sbErrText(e);setSave('Offline: i dati restano su questo dispositivo');}
}
async function sbRefresh(manual){
  if(!sb.ses||sb.busy)return;
  if(!manual&&(document.getElementById('sheet').open||document.getElementById('small').open))return;
  try{
    const rem=await sbPull();sb.ready=true;
    if(rem&&rem.hm&&(rem.updatedAt||0)>(state.updatedAt||0)){adopt(rem);sbOk();}
    else if(!rem||(state.updatedAt||0)>(rem.updatedAt||0))await sbPush();
    else sbOk();
    if(manual)renderAll();
  }catch(e){sb.ready=false;sb.err=sbErrText(e);setSave('Offline: i dati restano su questo dispositivo');}
}

function runName(km,sec,date){
  const c=(state.cal||[]).find(x=>x.date===date&&x.dist>=3&&Math.abs(x.dist-km)<=Math.max(1,x.dist*.15));
  if(c)return c.label;
  if(km>=16)return 'Lungo';
  if(km<5)return 'Corsa breve';

  return km>=10?'Corsa media':'Corsa facile';
}

}
function all(){

const byId=id=>all().find(s=>s.id===id);
function statusOf(s){
  if(s.hist)return 'done';

/* ---------- ritmi ---------- */
const zones=(hm,rg)=>({E:[hm*1.20,hm*1.30],T:hm*0.98,I:hm*0.905,HM:hm,RG:rg,NA:state.tg.napoli/HM_KM,MI:state.tg.milano/HM_KM});
function tok(k,off,plain){
  const z=zones(state.hm,state.rg);off=off||0;
  const t=k==='E'?mss(z.E[0]+off)+'–'+mss(z.E[1]+off):mss(z[k]+off);
  return plain?t:'<span class="pace num">'+t+'/km</span>';
}
const renderTokens=txt=>esc(txt).replace(/\{(E|T|I|HM|RG|NA|MI)([+-]\d+)?\}/g,(m,k,o)=>tok(k,o?Number(o):0));
function keyPace(s){
  if(s.kind==='easy'||s.kind==='long'&&!/\{(T|I|HM|RG|NA|MI)/.test(s.detail||''))return tok('E',0,1);
  const z=zones(state.hm,state.rg);let best=null;
  (s.detail||'').replace(/\{(RG|NA|MI|HM|T|I)([+-]\d+)?\}/g,(x,k,o)=>{const v=z[k]+(o?Number(o):0);if(best===null||v<best.v)best={k,o:o?Number(o):0,v};return x;});
  if(best)return tok(best.k,best.o,1);
  if(/\{E/.test(s.detail||''))return tok('E',0,1);
  return '';
}
const riegel=(dist,sec)=>sec*Math.pow(HM_KM/dist,1.06);
const runMin=s=>Math.round((s.km||0)*state.hm*1.25/60);

/* ---------- consigli ---------- */
function advisor(){
  const t=todayS(),from=add(t,-14),out=[];
  const runs=all().filter(s=>KIND[s.kind].run&&!s.opt&&s.date>=from&&s.date<t);
  const missed=runs.filter(s=>['skipped','away'].includes(statusOf(s))).length;
  const unlogged=runs.filter(s=>!statusOf(s)).length;
  if(missed>=4)out.push(['warn','Hai saltato '+missed+' corse nelle ultime 2 settimane','Ripeti l\'ultima settimana completata con volume ridotto del 30% e solo facili più allunghi, poi rientra nel piano. Dopo 2 settimane regolari fai un 5 km di test e ricalibra i ritmi.']);
  else if(missed>=2)out.push(['warn','Hai saltato '+missed+' corse nelle ultime 2 settimane','Non recuperarle aggiungendo sedute. Questa settimana accorcia la qualità di un terzo e il lungo di 2-3 km.']);
  else if(missed===1)out.push(['','Una corsa saltata','Non recuperarla: prosegui con il piano.']);
  if(unlogged>0)out.push(['','Da registrare: '+unlogged+(unlogged===1?' corsa':' corse')+' degli ultimi 14 giorni','Inserisci i risultati o segnale come saltate, così i consigli restano affidabili.']);
  (state.abs||[]).forEach(a=>{const d=diff(a.to,t);if(d>=0&&d<=7)out.push(['','Rientro dopo un\'assenza','Prima settimana: solo facili più allunghi e lungo ridotto di un terzo. Dopo più di 2 settimane ferme, ricalibra con un test.']);});
  return out;
}
function moveWarnings(s,nd){
  const hard=x=>['q','long','race'].includes(x.kind)&&!x.opt;
  const others=all().filter(o=>o.id!==s.id&&!['skipped','away'].includes(statusOf(o)));
  const w=[];

function splitsHTML(sp){

    note='<p class="hint">'+(Math.abs(df)<=3?'Ritmo costante dall\'inizio alla fine.':df<0?'Seconda metà più veloce di '+(-df)+'" al km (negative split).':'Seconda metà più lenta di '+df+'" al km.')+'</p>';}

/* profilo della seduta: altezza = intensità, larghezza = durata */
function flatSteps(steps){const o=[];steps.forEach(x=>{if(x.n!=null){for(let i=0;i<x.n;i++)x.steps.forEach(y=>o.push(y));}else o.push(x);});return o;}
function stepSecs(x,z){
  const pm=x.pace?(x.pace[0]+x.pace[1])/2:z.I;
  if(x.dur.m!=null)return x.dur.m*60;if(x.dur.s!=null)return x.dur.s;
  if(x.dur.km!=null)return x.dur.km*pm;if(x.dur.mtr!=null)return x.dur.mtr/1000*pm;return 60;
}
function stepInt(x,z){
  const pm=x.pace?(x.pace[0]+x.pace[1])/2:z.I,slow=z.E[1]+60,fast=z.I-15;
  return Math.max(.12,Math.min(1,(slow-pm)/(slow-fast)));
}
const intCol=i=>i<.34?'var(--easy)':i<.6?'var(--long)':i<.82?'var(--q)':'var(--race)';

  const z=zones(state.hm,state.rg),fl=flatSteps(steps).map(x=>({x,s:stepSecs(x,z),i:stepInt(x,z)}));
  const tot=fl.reduce((a,b)=>a+b.s,0);if(!tot)return '';
  const W=340,H=64,g=1.5;let X=0,svg='';
  fl.forEach(b=>{const w=Math.max(2,b.s/tot*W-g),h=8+(H-8)*b.i;svg+='<rect x="'+X.toFixed(1)+'" y="'+(H-h).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+intCol(b.i)+'"/>';X+=w+g;});
  return '<svg class="prof" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Profilo di intensità della seduta">'+svg+'</svg><div class="proflg"><span><i style="background:var(--easy)"></i>facile</span><span><i style="background:var(--long)"></i>medio</span><span><i style="background:var(--q)"></i>forte</span><span><i style="background:var(--race)"></i>molto forte</span><span class="num" style="margin-left:auto">'+Math.round(tot/60)+'\'</span></div>';
}
function stepsHTML(steps){

function assignTo(id){
  const a=assign,src=byId(a.from),t=byId(id);
  if(!src||!t||t.hist||t.id===src.id){toast('Scegli un altro allenamento');return;}
  const L=state.logs[src.id];if(!L){assign=null;renderCal();return;}
  if(state.logs[t.id]&&!confirm('«'+t.title+'» ha già un risultato: sostituirlo?'))return;
  assign=null;
  const snap=JSON.stringify({logs:state.logs,st:state.st,ov:state.ov,custom:state.custom}),day=src.date;
  state.logs[t.id]=Object.assign({},L);state.st[t.id]='done';
  delete state.logs[src.id];delete state.st[src.id];
  if(src.custom&&src.free)state.custom=state.custom.filter(c=>c.id!==src.id);
  else if(!L.act)state.st[src.id]='skipped';
  if(t.date!==day)applyMove(byId(t.id),day);
  calMonth=day.slice(0,7);calDay=day;curWeek=clampW(weekOf(day));commit();
  toast('Risultato assegnato a '+esc2(t.title)+' ('+fmtDay(day)+')',null,()=>{Object.assign(state,JSON.parse(snap));commit();});
}
function moveSession(id,nd){
  const s=byId(id);if(!s||s.date===nd)return;
  if(nd<W0||nd>LAST){toast('Quella data è fuori dal piano');return;}
  const prev=s.date,hadOv=state.ov[id]?JSON.parse(JSON.stringify(state.ov[id])):null,w=moveWarnings(s,nd);
  applyMove(s,nd);curWeek=clampW(weekOf(nd));commit();
  toast(esc2(s.title)+' → '+fmtDay(nd),w,()=>{
    if(s.custom){const c=state.custom.find(c=>c.id===id);if(c)c.date=prev;}
    else{if(hadOv)state.ov[id]=hadOv;else delete state.ov[id];}
    commit();
  });
}
const esc2=t=>String(t).length>26?String(t).slice(0,25)+'…':String(t);
let toastT=null;
function toast(msg,warns,undo){
  const t=document.getElementById('toast');
  t.innerHTML='<div>'+esc(msg)+(warns&&warns.length?'<span class="tw2">'+warns.map(esc).join('<br>')+'</span>':'')+'</div>'+(undo?'<button data-act="undo">Annulla</button>':'');
  try{if(t.hidePopover&&t.matches(':popover-open'))t.hidePopover();if(t.showPopover)t.showPopover();}catch(e){}
  t.classList.add('on');toast.undo=undo||null;clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('on'),warns&&warns.length?9000:5000);
}

function formLog(s){
  const k=KIND[s.kind],lg=state.logs[s.id]||{};
  if(k.run){
    form('Risultato','<p class="when">'+esc(s.title)+', '+fmtDay(s.date)+'</p>'+
      '<div class="row"><div class="field"><label for="lKm">Km</label><input id="lKm" type="number" step="0.01" inputmode="decimal" value="'+(lg.km||s.km||'')+'"></div><div class="field"><label for="lT">Tempo</label><input id="lT" placeholder="h:mm:ss o mm:ss" value="'+(lg.sec?hms(lg.sec):'')+'"></div></div>'+
      '<div class="row"><div class="field"><label for="lHr">FC media</label><input id="lHr" type="number" inputmode="numeric" value="'+(lg.hr||'')+'"></div><div class="field"><label for="lRpe">Fatica 1-10</label>'+rpeSel(lg.rpe)+'</div></div>'+
      '<div class="field"><label for="lNote">Note: sensazioni, stomaco, dolori</label><textarea id="lNote" rows="3">'+esc(lg.note||'')+'</textarea></div>'+
      ((s.kind==='race'||s.test)?'<label style="display:flex;gap:8px;font-size:14px"><input type="checkbox" id="lCal" checked> Usa per ricalibrare i ritmi</label>':'')+'<p class="live num" id="lLive"></p>',
      ()=>{
        const km=parseFloat(String(v('lKm')).replace(',','.')),sec=parseTime(v('lT'));
        state.logs[s.id]={km:isNaN(km)?null:km,sec:isNaN(sec)?null:sec,hr:parseInt(v('lHr'))||null,rpe:parseInt(v('lRpe'))||null,note:v('lNote').trim()};
        if(lg.act)state.logs[s.id].act=lg.act;
        state.st[s.id]='done';
        const c=document.getElementById('lCal');
        if(c&&c.checked&&km>=3&&sec>0){const d=s.kind==='race'?HM_KM:km;state.hm=riegel(d,sec)/HM_KM;state.cal.push({date:s.date,label:s.title,dist:d,sec});}
      },
      ()=>{const u=()=>{const km=parseFloat(String(v('lKm')).replace(',','.')),sec=parseTime(v('lT')),hr=parseInt(v('lHr'));let t='';
        if(km>0&&sec>0)t='Ritmo medio '+mss(sec/km)+'/km.';if(s.kind==='easy'&&hr>155)t+=' FC sopra 155: la prossima facile rallenta.';document.getElementById('lLive').textContent=t;};
        ['lKm','lT','lHr'].forEach(id=>document.getElementById(id).addEventListener('input',u));u();});
  }else{
    form('Seduta fatta','<p class="when">'+esc(s.title)+', '+fmtDay(s.date)+'</p><div class="field"><label for="lRpe">Fatica 1-10</label>'+rpeSel(lg.rpe)+'</div>'+
      '<div class="field"><label for="lNote">Ripetizioni e note</label><textarea id="lNote" rows="4" placeholder="Trazioni prone 8-7-7, supine 9-8-8, dip 10-10-9…">'+esc(lg.note||'')+'</textarea></div>',
      ()=>{state.logs[s.id]={rpe:parseInt(v('lRpe'))||null,note:v('lNote').trim()};state.st[s.id]='done';});
  }
}
function formMove(s){
  let sel=s.date,wk=clampW(weekOf(s.date));
  const draw=()=>{
    const mon=add(W0,wk*7),t=todayS(),others=all().filter(o=>o.id!==s.id);
    let h='<div class="mvh"><button class="iconbtn" data-mv="p" aria-label="Settimana precedente"'+(wk===0?' disabled':'')+'>‹</button><b class="num">'+fmtShort(mon)+' – '+fmtShort(add(mon,6))+'</b><button class="iconbtn" data-mv="n" aria-label="Settimana successiva"'+(wk===NWEEKS-1?' disabled':'')+'>›</button></div><div class="mvd">';
    for(let k=0;k<7;k++){const ds=add(mon,k),dt=dd(ds),l=others.filter(o=>o.date===ds);
      h+='<button class="mvb'+(ds===sel?' sel':'')+(ds===s.date?' cur':'')+(ds===t?' td':'')+'" data-mvd="'+ds+'"><span>'+WD[dt.getUTCDay()]+'</span><b class="num">'+dt.getUTCDate()+'</b><span class="mvdots">'+l.map(o=>'<i class="dot '+TCLS(o)+'"></i>').join('')+'</span></button>';}
    document.getElementById('mvPick').innerHTML=h+'</div>';
    document.getElementById('mvSel').textContent=sel===s.date?'Scegli il nuovo giorno. I puntini mostrano cosa c\'è già.':'Nuova data: '+fmtLong(sel);
    const w=sel!==s.date?moveWarnings(s,sel):[];
    document.getElementById('mWarn').innerHTML=w.length?'<div class="wlist">'+w.map(esc).join('<br>')+'</div>':'';
    document.getElementById('mDate').value=sel;
  };
  form('Sposta','<p class="when">'+esc(s.title)+', ora '+fmtLong(s.date)+'</p><div id="mvPick"></div><p class="live" id="mvSel"></p><div id="mWarn"></div>'+
    '<details class="mvmore"><summary>Scegli una data precisa</summary><div class="field"><input type="date" id="mDate" value="'+s.date+'" min="'+W0+'" max="'+LAST+'"></div></details>',
    ()=>{if(sel<W0||sel>LAST)return false;if(sel!==s.date){applyMove(s,sel);curWeek=clampW(weekOf(sel));}},
    ()=>{
      smallIn.onclick=e=>{
        const m=e.target.closest('[data-mv]'),d=e.target.closest('[data-mvd]');
        if(m){wk=clampW(wk+(m.dataset.mv==='n'?1:-1));draw();}
        else if(d){sel=d.dataset.mvd;draw();}
      };
      document.getElementById('mDate').addEventListener('change',()=>{const nd=v('mDate');if(nd){sel=nd;if(nd>=W0&&nd<=LAST)wk=weekOf(nd);draw();}});
      draw();
    });
}
function formEdit(s){
  form('Modifica','<div class="field"><label for="eT">Titolo</label><input id="eT" value="'+esc(s.title)+'"></div>'+
    (KIND[s.kind].run?'<div class="field"><label for="eKm">Km previsti</label><input id="eKm" type="number" step="0.1" value="'+(s.km||'')+'"></div>':'')+
    '<div class="field"><label for="eD">Descrizione</label><textarea id="eD" rows="5">'+esc(s.detail||'')+'</textarea></div><p class="live">Ritmi automatici: {E} facile, {T} soglia, {I} ripetute, {HM} mezza attuale, {NA} Napoli, {MI} Milano, {RG} Conero, anche con correzioni in secondi come {RG+10}.</p>',
    ()=>{const p={title:v('eT').trim()||s.title,detail:v('eD')};if(KIND[s.kind].run)p.km=parseFloat(v('eKm'))||0;
      if(s.custom)Object.assign(state.custom.find(c=>c.id===s.id),p);else state.ov[s.id]=Object.assign({},state.ov[s.id],p);});
