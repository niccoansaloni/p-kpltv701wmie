function formAdd(){
  const def=add(W0,curWeek*7+Math.max(0,Math.min(6,diff(add(W0,curWeek*7),todayS()))));
  form('Aggiungi allenamento','<div class="row"><div class="field"><label for="nD">Data</label><input type="date" id="nD" value="'+def+'" min="'+W0+'" max="'+LAST+'"></div>'+
    '<div class="field"><label for="nK">Tipo</label><select id="nK"><option value="easy">Corsa facile</option><option value="q">Qualità</option><option value="long">Lungo</option><option value="upper">Forza upper</option><option value="lower">Forza lower</option></select></div></div>'+
    '<div class="field"><label for="nT">Titolo</label><input id="nT" placeholder="Facile 40\'"></div><div class="field"><label for="nKm">Km (per le corse)</label><input id="nKm" type="number" step="0.1"></div><div class="field"><label for="nDet">Descrizione</label><textarea id="nDet" rows="3"></textarea></div>',
    ()=>{const k=v('nK'),d=v('nD');if(!d)return false;
      const w=WEEKS[clampW(weekOf(d))];
      state.custom.push({id:'c'+Date.now(),date:d,kind:k,title:v('nT').trim()||(KIND[k].str?STR_TITLE[k]:KIND[k].label),km:parseFloat(v('nKm'))||0,detail:v('nDet'),opt:false,str:KIND[k].str?(w.str&&w.str!=='viaggio'?w.str:'base'):null});
      curWeek=clampW(weekOf(d));});
}

async function exportJSON(){
  const name='piano-1h30-backup-'+todayS()+'.json',txt=JSON.stringify(state,null,1);
  try{
    const f=new File([txt],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){await navigator.share({files:[f],title:'Backup WeChain'});setSave('Backup pronto: salvalo in File');return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,1)],{type:'application/json'}));
  a.download='piano-mezza-backup-'+todayS()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function importFile(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!('hm' in d))throw 0;state=Object.assign(DEFAULT(),d);(state.custom||[]).forEach(c=>{if(c.kind==='upperA'||c.kind==='upperB')c.kind='upper';});commit();setSave('Backup importato');}catch(err){alert('File non valido: scegli un backup esportato da questa pagina.');}};
  r.readAsText(f);
}
function showTab(name){
  const was=document.querySelector('.panel.on');
  document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===name?'true':'false'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+name));
  if(!was||was.id!=='p-'+name){window.scrollTo({top:0,behavior:'instant'});const pn=document.getElementById('p-'+name);if(pn){pn.classList.remove('enter');void pn.offsetWidth;pn.classList.add('enter');setTimeout(()=>pn.classList.remove('enter'),900);}}
  if(name==='data')wkShow();
}
/* scorri a destra o sinistra sulla settimana per cambiarla */
(function(){
  let x0=null,y0=null;
  const el=document.getElementById('week');
  el.addEventListener('touchstart',e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;},{passive:true});
  el.addEventListener('touchend',e=>{
    if(x0===null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Math.abs(dx)>70&&Math.abs(dy)<45){const n=clampW(curWeek+(dx<0?1:-1));if(n!==curWeek){curWeek=n;renderAll();}}
  },{passive:true});
})();

document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');if(tab){assign=null;e.preventDefault();if(sheet.open)sheet.close();showTab(tab.dataset.tab);return;}
  const ql=e.target.closest('[data-quicklog]');if(ql){openId=ql.dataset.quicklog;formLog(byId(openId));return;}
  const op=e.target.closest('[data-open]');if(op&&op.dataset.open&&!e.target.closest('[data-act],[data-quicklog]')){if(assign){assignTo(op.dataset.open);return;}openSession(op.dataset.open);return;}
  const dy=e.target.closest('[data-day]');if(dy){calDay=dy.dataset.day;renderCal();return;}
  const wk=e.target.closest('[data-week]');if(wk){curWeek=+wk.dataset.week;setCalMode('week');renderAll();showTab('cal');return;}
  const gt=e.target.closest('[data-goto]');if(gt){if(sheet.open)sheet.close();showTab(gt.dataset.goto);return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  const s=openId?byId(openId):null;
  switch(b.dataset.act){
    case 'close':sheet.close();break;
    case 'undo':if(toast.undo){toast.undo();toast.undo=null;}document.getElementById('toast').classList.remove('on');break;
    case 'unlog':if(s&&confirm('Cancellare il risultato di questo allenamento?')){const lg=state.logs[s.id];if(lg&&lg.act){state.ign=state.ign||{};state.ign[lg.act]=1;}delete state.logs[s.id];delete state.st[s.id];commit();openSession(s.id);}break;
    case 'loadact':{const id=b.dataset.a;b.disabled=true;b.textContent='Scarico…';
      actFill(id).then(()=>{actsSave();renderAll();if(openId)openSession(openId,true);}).catch(()=>{b.disabled=false;b.textContent='Scarica i dettagli';toast('Non riesco a scaricare i dati dall\'orologio');});break;}
    case 'prev':curWeek=clampW(curWeek-1);renderAll();break;
    case 'next':curWeek=clampW(curWeek+1);renderAll();break;
    case 'today':curWeek=clampW(weekOf(todayS()));renderAll();break;
    case 'add':formAdd();break;
    case 'mprev':case 'mnext':{const MONTHS=monthsList(),i=MONTHS.indexOf(calMonth)+(b.dataset.act==='mnext'?1:-1);if(i>=0&&i<MONTHS.length){calMonth=MONTHS[i];renderCal();}break;}
    case 'mtoday':calMonth=null;calDay=null;renderCal();break;
    case 'assign':if(s){assign={from:s.id,date:s.date};sheet.close();calMonth=s.date.slice(0,7);calDay=s.date;setCalMode('month');showTab('cal');renderCal();}break;
    case 'cm':setCalMode(b.dataset.m);break;
    case 'cmode':chartMode=b.dataset.m;renderDash(weekData());break;
    case 'assignX':assign=null;renderCal();break;
    case 'log':formLog(s);break;
    case 'move':formMove(s);break;
    case 'edit':formEdit(s);break;
    case 'skip':state.st[s.id]='skipped';commit();openSession(s.id);break;
    case 'unskip':delete state.st[s.id];commit();openSession(s.id);break;
    case 'reset':delete state.ov[s.id];commit();openSession(s.id);break;
    case 'del':if(confirm('Eliminare questo allenamento?')){const l0=state.logs[s.id];if(l0&&l0.act){state.ign=state.ign||{};state.ign[l0.act]=1;}state.custom=state.custom.filter(c=>c.id!==s.id);delete state.logs[s.id];delete state.st[s.id];sheet.close();commit();}break;
    case 'sk':strKind=b.dataset.k;renderStr();break;
    case 'sp':strPh=b.dataset.p;renderStr();break;
    case 'calib':{const d=calDist(),sec=parseTime(v('cTime'));if(!d||!sec){document.getElementById('cPrev').textContent='Inserisci distanza e tempo, per esempio 21:30 per un 5 km.';break;}
      state.hm=riegel(d,sec)/HM_KM;state.cal.push({date:todayS(),label:v('cLabel').trim()||d+' km',dist:d,sec});commit();setSave('Ritmi aggiornati');break;}
    case 'goal':{let ok=true;RACES.forEach(r=>{const sec=parseTime(v('tg_'+r.id));if(sec>3600&&sec<9000)state.tg[r.id]=sec;else ok=false;});state.rg=state.tg.conero/HM_KM;commit();setSave(ok?'Obiettivi aggiornati':'Alcuni tempi non sono validi: usa h:mm:ss');break;}
    case 'absAdd':{const f=v('aFrom'),t=v('aTo');if(!f||!t||t<f){alert('Scegli le date di inizio e fine.');break;}state.abs.push({from:f,to:t,note:v('aNote').trim()});commit();break;}
    case 'absDel':state.abs.splice(+b.dataset.i,1);commit();break;
    case 'export':exportJSON();break;
    case 'icuSync':icuSync(true);break;
    case 'icuOff':if(confirm('Scollegare l\'orologio su questo dispositivo? Gli allenamenti già inviati restano su Intervals.icu.')){localStorage.removeItem(ICU_KEY);localStorage.removeItem(ICU_HASH);icu.cfg=null;icu.msg='';renderWatch();}break;
    case 'icuSave':{
      const id=v('iId').trim(),key=v('iKey').trim(),m=document.getElementById('iMsg');
      if(!/^i?\d+$/i.test(id)||!key){m.textContent='Inserisci Athlete ID (tipo i123456) e API key.';break;}
      icu.cfg={id,key};m.textContent='Verifica in corso…';
      icuFetch('').then(r=>{if(!r.ok)throw {status:r.status};localStorage.setItem(ICU_KEY,JSON.stringify(icu.cfg));icu.last=0;icuSync(true);}).catch(e=>{icu.cfg=null;const mm=document.getElementById('iMsg');if(mm)mm.textContent=icuErr(e);});
      break;}
    case 'sbPwd':case 'sbSign':{const em=v('bEmail').trim(),pw=v('bPwd'),m=document.getElementById('bMsg'),cu=document.getElementById('bUrl'),sign=b.dataset.act==='sbSign';
      if(cu){const u=cu.value.trim().replace(/\/+$/,''),k=v('bKey').trim();
        if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(u)||k.length<40){m.textContent='Controlla indirizzo del progetto e chiave pubblica.';break;}
        sb.cfg={url:u,key:k};try{localStorage.setItem(SB_CFG,JSON.stringify(sb.cfg));}catch(e){}}
      if(!/^\S+@\S+\.\S+$/.test(em)){m.textContent='Scrivi un indirizzo email valido.';break;}
      if(pw.length<6){m.textContent='La password deve avere almeno 6 caratteri.';break;}
      m.textContent=sign?'Creazione account…':'Accesso in corso…';
      fetch(sb.cfg.url+'/auth/v1/'+(sign?'signup':'token?grant_type=password'),{method:'POST',headers:sbH(),body:JSON.stringify({email:em,password:pw})})
        .then(async r=>{
          let j={};try{j=await r.json();}catch(e){}
          if(!r.ok){const d=j.msg||j.message||j.error_description||j.error||'';
            m.textContent=(r.status===429?'Troppi tentativi: riprova tra poco.':!sign&&(r.status===400||r.status===401)?'Email o password non corretti.':'Operazione non riuscita ('+r.status+').')+(d?' Dettaglio: '+d:'');return;}
          if(!j.access_token){m.textContent='Account creato: controlla la tua email per confermarlo, poi accedi con la password.';return;}
          sbSession(j);sb.ready=false;sb.err='';await sbInit();renderAll();})
        .catch(()=>{m.textContent='Non riesco a contattare il servizio.';});
      break;}
    case 'sbSend':{const em=v('bEmail').trim(),m=document.getElementById('bMsg'),cu=document.getElementById('bUrl');
      if(cu){const u=cu.value.trim().replace(/\/+$/,''),k=v('bKey').trim();
        if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(u)||k.length<40){m.textContent='Controlla indirizzo del progetto e chiave pubblica.';break;}
        sb.cfg={url:u,key:k};try{localStorage.setItem(SB_CFG,JSON.stringify(sb.cfg));}catch(e){}}
      if(!/^\S+@\S+\.\S+$/.test(em)){m.textContent='Scrivi un indirizzo email valido.';break;}
      m.textContent='Invio in corso…';
      fetch(sb.cfg.url+'/auth/v1/otp?redirect_to='+encodeURIComponent(location.origin+location.pathname),{method:'POST',headers:sbH(),body:JSON.stringify({email:em,create_user:true})})
        .then(async r=>{if(r.ok){m.textContent='Email inviata a '+em+'. Scrivi il codice qui sotto, oppure apri il link nell\'email.';return;}
          let d='';try{const j=await r.json();d=j.msg||j.message||j.error_description||j.error||'';}catch(e){}
          m.textContent=(r.status===429?'Troppi tentativi: riprova tra qualche minuto.':r.status===422||r.status===400?'Questo indirizzo non può accedere.':'Invio non riuscito ('+r.status+').')+(d?' Dettaglio: '+d+' ('+r.status+')':'');})
        .catch(()=>{m.textContent='Non riesco a contattare il servizio.';});
      break;}
    case 'sbVerify':{if(!sb.cfg){document.getElementById('bMsg').textContent='Prima invia il codice.';break;}const em=v('bEmail').trim(),code=v('bCode').trim().replace(/\s/g,''),m=document.getElementById('bMsg');
      if(!em||!code){m.textContent='Scrivi email e codice.';break;}
      m.textContent='Verifica in corso…';
      fetch(sb.cfg.url+'/auth/v1/verify',{method:'POST',headers:sbH(),body:JSON.stringify({type:'email',email:em,token:code})})
        .then(async r=>{if(!r.ok){m.textContent='Codice non valido o scaduto.';return;}
          sbSession(await r.json());sb.ready=false;sb.err='';await sbInit();renderAll();})
        .catch(()=>{m.textContent='Non riesco a contattare il servizio.';});
      break;}
    case 'sbNow':sbRefresh(true);break;
    case 'sbOut':if(confirm('Uscire dall\'account su questo dispositivo? I dati restano qui e nel tuo account.')){sbSave(null);sb.ready=false;setSave('Salvato su questo dispositivo');renderAll();}break;
    case 'sbCfgOff':if(confirm('Cambiare progetto su questo dispositivo? I dati restano qui e nel tuo account.')){localStorage.removeItem(SB_CFG);sb.cfg=null;sb.err='';renderAll();}break;
  }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-open],[role=button][data-day]')){e.preventDefault();e.target.click();}});
[sheet,small].forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close();}));
sheet.addEventListener('close',()=>{openId=null;});

/* tastiera su telefono: il pannello segue l'area realmente visibile e il campo in uso resta in vista */
(function(){
  const vv=window.visualViewport,r=document.documentElement.style;
  const upd=()=>{if(!vv)return;r.setProperty('--vvh',vv.height+'px');r.setProperty('--vvt',vv.offsetTop+'px');};
  if(vv){vv.addEventListener('resize',upd);vv.addEventListener('scroll',upd);upd();}
  small.addEventListener('focusin',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))setTimeout(()=>{try{e.target.scrollIntoView({block:'center',behavior:'smooth'});}catch(x){}},320);});
})();

/* chiudi un pannello trascinandolo verso il basso (da maniglia, intestazione o dall'inizio del contenuto) */
function swipeDismiss(dlg){
  let y0=null,x0=0,dy=0,head=false,on=false,t0=0;
  const phone=()=>matchMedia('(max-width:860px)').matches;
  const atTop=el=>{for(;el&&el!==dlg;el=el.parentElement){if(el.scrollHeight>el.clientHeight+1&&/auto|scroll/.test(getComputedStyle(el).overflowY)&&el.scrollTop>0)return false;}return true;};
  dlg.addEventListener('touchstart',e=>{
    if(!phone()||e.touches.length!==1){y0=null;return;}
    const t=e.touches[0];y0=t.clientY;x0=t.clientX;dy=0;on=false;t0=Date.now();head=!!e.target.closest('.sh,.fh');
  },{passive:true});
  dlg.addEventListener('touchmove',e=>{
    if(y0===null)return;const t=e.touches[0],mx=t.clientX-x0,my=t.clientY-y0;
    if(!on){
      if(my>10&&my>Math.abs(mx)*1.2&&(head||(atTop(e.target)&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)))){on=true;dlg.style.transition='none';}
      else{if(Math.abs(mx)>12||my<-8)y0=null;return;}
    }
    dy=Math.max(0,my);dlg.style.transform='translateY('+dy+'px)';if(e.cancelable)e.preventDefault();
  },{passive:false});
  const fin=()=>{
    if(y0===null||!on){y0=null;return;}
    const vel=dy/Math.max(1,Date.now()-t0);dlg.style.transition='transform .2s ease';
    if(dy>120||(vel>.7&&dy>40)){dlg.style.transform='translateY(100%)';setTimeout(()=>{dlg.close();dlg.style.transition='';dlg.style.transform='';},190);}
    else{dlg.style.transform='';setTimeout(()=>{dlg.style.transition='';},220);}
    y0=null;on=false;
  };
  dlg.addEventListener('touchend',fin);dlg.addEventListener('touchcancel',fin);
}
swipeDismiss(sheet);swipeDismiss(small);

/* trascinamento: tieni premuto un allenamento e portalo su un altro giorno */
(function(){
  const HOLD=380,SLOP=10;let g=null,suppress=0,raf=0;
  const dropAt=(x,y)=>{const e=document.elementFromPoint(x,y),c=e&&e.closest('[data-day],.day[data-date]');return c?{el:c,date:c.dataset.day||c.dataset.date}:null;};
  const place=()=>{if(g&&g.ghost){g.ghost.style.left=g.x+'px';g.ghost.style.top=g.y+'px';}};
  const hover=()=>{const o=dropAt(g.x,g.y);if(g.over&&(!o||o.el!==g.over.el))g.over.el.classList.remove('drop-on');if(o)o.el.classList.add('drop-on');g.over=o;};
  const loop=()=>{cancelAnimationFrame(raf);const step=()=>{if(!g||!g.active)return;const hh=innerHeight;let dy=0;
    if(g.y<90)dy=-Math.ceil((90-g.y)/5);else if(g.y>hh-120)dy=Math.ceil((g.y-(hh-120))/5);
    if(dy){scrollBy(0,dy);hover();}raf=requestAnimationFrame(step);};raf=requestAnimationFrame(step);};
  function cancel(){if(!g)return;clearTimeout(g.t);cancelAnimationFrame(raf);g.el.classList.remove('lp-pre','drag-src');if(g.ghost)g.ghost.remove();if(g.over)g.over.el.classList.remove('drop-on');document.body.classList.remove('dragging');g=null;}
  function activate(){
    if(!g||g.active)return;const s=byId(g.id);if(!s){cancel();return;}
    g.active=true;clearTimeout(g.t);
    const k=document.createElement('div');k.className='dgh '+TCLS(s);k.innerHTML=esc(esc2(s.title))+'<span>'+fmtDay(s.date)+'</span>';document.body.appendChild(k);g.ghost=k;
    g.el.classList.remove('lp-pre');g.el.classList.add('drag-src');document.body.classList.add('dragging');
    if(navigator.vibrate)try{navigator.vibrate(18);}catch(e){}
    place();hover();loop();
  }
  function begin(el,x,y,touch){
    cancel();const id=el.dataset.open;if(!id||!byId(id))return;
    g={id,el,x0:x,y0:y,x,y,touch,active:false,over:null,ghost:null,t:null};
    if(touch){g.el.classList.add('lp-pre');g.t=setTimeout(activate,HOLD);}
  }
  function move(x,y,ev){
    if(!g)return;g.x=x;g.y=y;
    if(!g.active){if(Math.hypot(x-g.x0,y-g.y0)>(g.touch?SLOP:6)){if(g.touch)cancel();else activate();}return;}
    if(ev&&ev.cancelable)ev.preventDefault();place();hover();
  }
  function end(){
    if(!g)return;const q=g,active=g.active,over=g.over;cancel();
    if(active){suppress=Date.now();const s=byId(q.id);if(over&&s&&over.date!==s.date)moveSession(q.id,over.date);}
  }
  const pick=e=>e.target.closest&&e.target.closest('.tile[data-open]:not(.hist),.chip[data-open]:not(.hist)');
  document.addEventListener('touchstart',e=>{if(e.touches.length!==1){cancel();return;}const el=pick(e);if(el){const t=e.touches[0];begin(el,t.clientX,t.clientY,true);}},{passive:true});
  document.addEventListener('touchmove',e=>{if(g){const t=e.touches[0];move(t.clientX,t.clientY,e);}},{passive:false});
  document.addEventListener('touchend',end);
  document.addEventListener('touchcancel',cancel);
  document.addEventListener('mousedown',e=>{if(e.button!==0)return;const el=pick(e);if(el)begin(el,e.clientX,e.clientY,false);});
  document.addEventListener('mousemove',e=>{if(g&&!g.touch)move(e.clientX,e.clientY,e);});
  document.addEventListener('mouseup',()=>{if(g&&!g.touch)end();});
  document.addEventListener('contextmenu',e=>{if(pick(e)&&(g||'ontouchstart' in window))e.preventDefault();});
  document.addEventListener('click',e=>{if(Date.now()-suppress<450&&e.target.closest('.tile,.chip,.mc,.day')){e.stopPropagation();e.preventDefault();}},true);
})();

(async function(){const nj=document.getElementById('nojs');if(nj)nj.remove();await load();renderAll();icuSync(false);})();
})();
